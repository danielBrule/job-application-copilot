[project]
name = "job-application-copilot"
version = "0.1.0"
description = "Evidence-grounded career decision and document-generation workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "streamlit (>=1.60.0,<2.0.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "alembic (>=1.18,<2.0)",
    "python-docx (>=1.2,<2.0)",
    "openai (>=2.48.0,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "job_application_copilot", from = "src" }]
include = [
    { path = "src/job_application_copilot/assets/assessment-prompt-v1.txt", format = ["sdist", "wheel"] },
    { path = "src/job_application_copilot/assets/cv-generation-en-stage-1-v1.txt", format = ["sdist", "wheel"] },
    { path = "src/job_application_copilot/assets/cv-generation-fr-extension-1-v1.txt", format = ["sdist", "wheel"] },
    { path = "src/job_application_copilot/assets/cv-generation-fr-extension-2-v1.txt", format = ["sdist", "wheel"] },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
markers = [
    "openai_integration: opt-in tests that create and delete real OpenAI resources"
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".pytest-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = ["src/job_application_copilot/repositories/migrations/"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["lxml.*", "streamlit.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["job_application_copilot"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "mypy (>=1.18,<2.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.0,<8.0)",
    "ruff (>=0.15.22,<0.16.0)",
    "types-pyyaml (>=6.0.12.20250915,<7.0.0)"
]
